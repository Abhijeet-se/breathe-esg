# ============================================
# Render Blueprint — Breathe ESG Platform
# ============================================
# Deploy via: render.com > New Blueprint > Connect GitHub repo
# This configures a web service + PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
# ============================================

databases:
  - name: breathe-esg-db
    plan: free
    databaseName: breathe_esg
    user: breathe_user
    region: oregon

services:
  - type: web
    name: breathe-esg
    plan: free
    runtime: python
    region: oregon
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "cd backend && gunicorn breathe_esg.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://breathe-esg.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: NODE_VERSION
        value: "20.10.0"
