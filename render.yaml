# ============================================
# Render Blueprint — Breathe ESG Platform
# ============================================

databases:
  - name: breathe-esg-db
    plan: free
    databaseName: breathe_esg
    user: breathe_user
    region: oregon

services:
  - type: web
    name: breathe-esg
    plan: free
    runtime: python
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt && cd backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn breathe_esg.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.6"
